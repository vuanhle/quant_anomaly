name: Build Bat Xat 2 VN-2000 GIS products

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bat-xat-2-vn2000.yml'
      - 'scripts/bat_xat_2_products.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 matplotlib==3.9.2 rasterio==1.4.3 geopandas==1.0.1 shapely==2.0.6 pyproj==3.7.0 pystac-client==0.8.5 planetary-computer==1.0.0

      - name: Build imagery and terrain products
        env:
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.TIF
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          VSI_CACHE: 'TRUE'
          VSI_CACHE_SIZE: '50000000'
        run: python scripts/bat_xat_2_products.py

      - name: List outputs
        run: find outputs -maxdepth 3 -type f -printf '%p %k KB\n' | sort

      - name: Upload GIS products
        uses: actions/upload-artifact@v4
        with:
          name: Bat_Xat_2_VN2000_products
          path: |
            Bat_Xat_2_VN2000_products.zip
            outputs/Bat_Xat_2_VN2000/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
